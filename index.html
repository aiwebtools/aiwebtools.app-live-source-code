            c.style.width=vw+'px'; c.style.height=vh+'px';
          });
          matrixCtx.setTransform(dpr,0,0,dpr,0,0); cubeCtx.setTransform(dpr,0,0,dpr,0,0); burstCtx.setTransform(dpr,0,0,dpr,0,0);
          columns=Math.max(1,Math.floor(vw/fontSize));
          drops=Array.from({length:columns},function(){return Math.random()*-vh/fontSize;});
          speeds=Array.from({length:columns},function(){return .76+Math.random()*.82;});
        }
        var lastMatrix=0;
        function drawMatrix(ts){
          if(overlay.classList.contains('fade-out')) return;
           // Keep visible motion without starving React during first interaction.
           if(ts && ts-lastMatrix < (vw<=768?34:24)){ requestAnimationFrame(drawMatrix); return; }
          var delta = lastMatrix ? Math.min(2.2, Math.max(.7, ((ts || lastMatrix) - lastMatrix) / 22)) : 1;
          lastMatrix = ts || 0;
          matrixCtx.fillStyle='rgba(0,0,0,'+fade+')'; matrixCtx.fillRect(0,0,vw,vh);
          matrixCtx.textBaseline='top';
          for(var i=0;i<drops.length;i++){
            var x=i*fontSize, y=drops[i]*fontSize;
            matrixCtx.font='bold '+fontSize+'px "Share Tech Mono",monospace';
            matrixCtx.fillStyle='rgba(210,255,224,'+(Math.random()*.28+.7)+')';
            matrixCtx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],x,y);
            matrixCtx.font=fontSize+'px "Share Tech Mono",monospace';
            matrixCtx.fillStyle='rgba(0,'+Math.floor(Math.random()*90+160)+','+Math.floor(Math.random()*45+28)+','+(Math.random()*.32+.44)+')';
            matrixCtx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],x,y-fontSize);
            if(Math.random()>.72){
              matrixCtx.fillStyle='rgba(0,255,65,'+(Math.random()*.22+.16)+')';
              matrixCtx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)],x,y-fontSize*2);
            }
            if(y>vh&&Math.random()>.974) drops[i]=0;
            drops[i]+=speeds[i]*delta;
          }
          requestAnimationFrame(drawMatrix);
        }
        // 5D hypercube
        var points=[]; for(var a=-1;a<=1;a+=2)for(var b=-1;b<=1;b+=2)for(var c=-1;c<=1;c+=2)for(var d=-1;d<=1;d+=2)for(var e=-1;e<=1;e+=2)points.push([a,b,c,d,e]);
        var edges=[]; for(var i=0;i<points.length;i++)for(var j=i+1;j<points.length;j++){var df=0;for(var k=0;k<5;k++)if(points[i][k]!==points[j][k])df++;if(df===1)edges.push([i,j]);}
        function rot(p,q,t){var co=Math.cos(t),si=Math.sin(t);return[p*co-q*si,p*si+q*co];}
        function project(pt){
          var x=pt[0],y=pt[1],z=pt[2],w=pt[3],v=pt[4],r;
          r=rot(x,y,cubeAngle*.74); x=r[0]; y=r[1];
          r=rot(z,w,cubeAngle*.62); z=r[0]; w=r[1];
          r=rot(x,z,cubeAngle*.48); x=r[0]; z=r[1];
          r=rot(y,w,cubeAngle*.38); y=r[0]; w=r[1];
          r=rot(x,v,cubeAngle*.29); x=r[0]; v=r[1];
          r=rot(w,v,cubeAngle*.21); w=r[0]; v=r[1];
          var s5=3.2/(3.2-v); x*=s5; y*=s5; z*=s5; w*=s5;
          var s4=4.15/(4.15-w); x*=s4; y*=s4; z*=s4;
          var s3=5.1/(5.1-z);
          var fs=Math.min(vw,vh)*cubeScale*s3;
          var yo=vw<=900?-vh*.12:-vh*.04;
          return{x:vw/2+x*fs,y:vh/2+yo+y*fs,depth:s3*s4*s5};
        }
        function drawCube(){
          if(overlay.classList.contains('fade-out')) return;
          cubeCtx.clearRect(0,0,vw,vh);
          var proj=points.map(project);
          cubeCtx.save(); cubeCtx.globalCompositeOperation='lighter';
          edges.forEach(function(ed){
            var p1=proj[ed[0]], p2=proj[ed[1]], gl=Math.min(1,(p1.depth+p2.depth)/3.1);
            cubeCtx.beginPath(); cubeCtx.moveTo(p1.x,p1.y); cubeCtx.lineTo(p2.x,p2.y);
            cubeCtx.strokeStyle='rgba(0,255,65,'+(.18+gl*.6)+')'; cubeCtx.lineWidth=.9+gl*2.0;
            cubeCtx.stroke();
          });
          proj.forEach(function(p,idx){
            var pu=Math.sin(cubeAngle*6+idx)*.5+.5, rad=Math.max(1.4,1.7+p.depth*1.55+pu*1.25);
            cubeCtx.beginPath(); cubeCtx.arc(p.x,p.y,rad,0,Math.PI*2);
            cubeCtx.fillStyle='rgba(190,255,210,'+(.48+pu*.5)+')';
            cubeCtx.fill();
          });
          cubeCtx.restore();
          cubeAngle+=vw<=560?.0085:.0115;
          requestAnimationFrame(drawCube);
        }
        function drawBurst(){
          if(overlay.classList.contains('fade-out')) return;
          // No active particles → skip the rAF entirely. The pointerdown
          // handler restarts the loop. Saves ~1 rAF/frame of idle main-thread
          // work before React mounts.
          if(burst.length===0){ burstRunning=false; return; }
          burstCtx.clearRect(0,0,vw,vh);
          for(var i=burst.length-1;i>=0;i--){
            var p=burst[i]; p.x+=p.vx; p.y+=p.vy; p.life-=1; p.size*=.985;
            burstCtx.beginPath(); burstCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
            burstCtx.fillStyle='rgba(0,255,65,'+Math.max(0,p.life/p.maxLife)+')';
            burstCtx.fill();
            if(p.life<=0) burst.splice(i,1);
          }
          requestAnimationFrame(drawBurst);
        }
        var burstRunning=false;
        function startBurst(){ if(!burstRunning){ burstRunning=true; requestAnimationFrame(drawBurst); } }
        overlay.addEventListener('pointerdown',function(ev){
          for(var n=0;n<46;n++){var ang=Math.random()*Math.PI*2,sp=Math.random()*5+1.2;
            burst.push({x:ev.clientX,y:ev.clientY,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,size:Math.random()*2.8+1.2,life:Math.floor(Math.random()*28+18),maxLife:46});}
          var col=Math.floor(ev.clientX/fontSize);
          for(var k=Math.max(0,col-8);k<Math.min(drops.length,col+8);k++) drops[k]=Math.random()*-8;
          startBurst();
        });
        // Binary strip
        var strip=document.getElementById('aiwt-binary-strip');
        function bin(){var o='';for(var i=0;i<130;i++)o+=(Math.random()>.5?'1':'0')+' ';return o;}
        for(var b=0;b<4;b++){var sp=document.createElement('span');sp.textContent=bin();sp.style.animationDelay=(b*1.2)+'s';strip.appendChild(sp);}
        setInterval(function(){if(overlay.classList.contains('fade-out'))return;strip.querySelectorAll('span').forEach(function(s){s.textContent=bin();});},1800);
        // Terminal lines progressive
        function addLine(html){
          var ln=document.createElement('span'); ln.className='aiwt-line'; ln.innerHTML=html;
          terminalLines.insertBefore(ln,cursor);
          var all=terminalLines.querySelectorAll('.aiwt-line');
          var maxL=window.innerWidth<=560?6:window.innerWidth<=900?7:8;
          if(all.length>maxL) all[0].remove();
        }
        // Boot sequence — paced over a target while the watchdog drives real progress width.
        window.__aiwtBootLabel = function(text){ if(progressLabel) progressLabel.textContent = text; };
        var TARGET_MS = 2800;
        BOOT_LINES.forEach(function(line,idx){
          var delay = Math.round(TARGET_MS * (idx / (BOOT_LINES.length-1)));
          setTimeout(function(){
            if(overlay.classList.contains('fade-out')) return;
            addLine(line.html);
            if(progressLabel) progressLabel.textContent = line.label;
          },delay);
        });
        // Counter & coords loop
        var startedAt = performance.now();
        var statsInt = setInterval(function(){
          if(overlay.classList.contains('fade-out')){clearInterval(statsInt);return;}
          var elapsed=performance.now()-startedAt, ratio=Math.min(1,elapsed/TARGET_MS);
          statTools.textContent = Math.min(4217,Math.floor(4217*Math.pow(ratio,.72))).toLocaleString();
          statNodes.textContent = Math.min(180,Math.floor(180*Math.pow(ratio,.86))).toLocaleString();
          statLatency.textContent = Math.floor(Math.random()*10+3)+' ms';
          coordA.textContent = (Math.sin(cubeAngle)*.5+.5).toFixed(3);
          coordB.textContent = (Math.cos(cubeAngle*.74)*.5+.5).toFixed(3);
          coordC.textContent = (Math.sin(cubeAngle*1.33)*.5+.5).toFixed(3);
        },140);
        // Initial paint — defer heavy canvas work one frame so the overlay
        // (logo, terminal, progress bar) paints instantly. This fixes the
        // perceived "slow to open" delay where the screen stayed black while
        // the matrix/cube/burst canvases initialized synchronously.
        requestAnimationFrame(function(){
          resize();
          requestAnimationFrame(drawMatrix);
          requestAnimationFrame(drawCube);
        });
        var rt;
        window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,120);});
      })();
    </script>
