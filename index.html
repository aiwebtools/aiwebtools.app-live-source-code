    <script>
      (function () {
        let started = false;

        // Unified boot tracer — every loader/reload/audio event pushes here so
        // we can diagnose exactly which mechanism removed the loading screen.
        // Inspect at any time with:  console.table(window.__aiwtBoot)
        var boot = (window.__aiwtBoot = window.__aiwtBoot || []);
        var bootStart = performance.now();
        var trace = function (event, info) {
          try {
            boot.push({
              t: Math.round(performance.now() - bootStart),
              event: event,
              info: info || null,
            });
          } catch (_) { /* tracer must never throw */ }
        };
        window.__aiwtBootTrace = trace;
        trace('html-loader-script-eval');

        // Single unified reload guard. Replaces the three competing keys that
        // used to allow double/triple reloads on the same boot:
        //   - main.tsx       __chunk_reload_attempted__
        //   - index.html     __aiwt_boot_watchdog_reload_at__
        //   - lazyWithRetry  aiwt:chunk-reload
        // 30s cooldown across the whole app — never more than ONE reload per boot.
        window.__aiwtReloadGuard = {
          KEY: 'aiwt:reload-guard',
          COOLDOWN_MS: 8000,
          canReload: function () {
            try {
              var last = Number(sessionStorage.getItem(this.KEY) || '0');
              return !last || (Date.now() - last > this.COOLDOWN_MS);
            } catch (_) { return false; }
          },
          mark: function (reason) {
            try { sessionStorage.setItem(this.KEY, String(Date.now())); } catch (_) {}
            trace('reload-guard-mark', reason || null);
          },
          clear: function () {
            try { sessionStorage.removeItem(this.KEY); } catch (_) {}
            trace('reload-guard-clear');
          },
          msUntilReload: function () {
            try {
              var last = Number(sessionStorage.getItem(this.KEY) || '0');
              return last ? Math.max(0, this.COOLDOWN_MS - (Date.now() - last)) : 0;
            } catch (_) { return this.COOLDOWN_MS; }
          },
        };

        const start = () => {
          if (started) return;
          started = true;
          trace('progress-start');

          let removed = false;
          let routeReady = !!window.__aiwtRouteReady;
          let finishing = false;
          const bar = document.getElementById('progress-bar');
          const pct = document.getElementById('progress-pct');
          const startTime = performance.now();
           // React content wins immediately. The former multi-second minimum
           // made a healthy app feel frozen and kept this overlay above usable UI.
           // Phones need a moment more before the curtain lifts, otherwise the
           // first tap lands while React is still hydrating below-hero work.
           const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
           // Keep the cinematic entry, but never leave an invisible full-screen
           // hit target over an already-interactive directory.
           const MIN_BOOT_MS = IS_TOUCH ? 1400 : 1200;
           const MAX_BOOT_MS = 5000;
           const FINISH_DELAY_MS = 100;

          const removeSpinner = (reason) => {
            if (removed || finishing) return;
            finishing = true;
            trace('spinner-finish-start', reason || null);
            const spinner = document.querySelector('.loading-spinner');
            const label = document.getElementById('aiwt-progress-label');
            const tools = document.getElementById('aiwt-stat-tools');
            const nodes = document.getElementById('aiwt-stat-nodes');
            const latency = document.getElementById('aiwt-stat-latency');
            const seconds = document.getElementById('progress-sec');
            if (label) label.textContent = 'WELCOME NEO';
            if (tools) tools.textContent = '5,563';
            if (nodes) nodes.textContent = '180';
            if (latency) latency.textContent = '3 ms';
            if (seconds) seconds.textContent = '0s';
            if (bar) bar.style.width = '100%';
            if (pct) pct.textContent = '100%';
            try { window.__aiwtLoaderClosing = true; } catch (_) {}
            if (spinner) spinner.classList.add('portal-opening');
            setTimeout(function() {
              if (removed) return;
              removed = true;
              trace('spinner-removed', reason || null);
              if (spinner) {
                spinner.classList.add('fade-out');
                spinner.setAttribute('aria-busy', 'false');
                spinner.style.pointerEvents = 'none';
                setTimeout(() => spinner.remove(), 220);
              }
            }, FINISH_DELAY_MS);
          };

          const requestFinish = (reason) => {
            if (removed || finishing) return;
            const elapsed = performance.now() - startTime;
            const wait = Math.max(0, MIN_BOOT_MS - elapsed);
            setTimeout(function() { removeSpinner(reason); }, wait);
          };

          const hardRemoveSpinner = (reason) => {
            if (removed || finishing) return;
            removed = true;
            trace('spinner-hard-removed', reason || null);
            if (bar) bar.style.width = '100%';
            if (pct) pct.textContent = '100%';
            const spinner = document.querySelector('.loading-spinner');
            if (spinner) {
              spinner.classList.add('fade-out');
              spinner.setAttribute('aria-busy', 'false');
              spinner.style.pointerEvents = 'none';
              setTimeout(() => spinner.remove(), 220);
            }
          };

          // Remove cube when React has mounted route UI. Keep this intentionally
          // permissive so mobile/preview wrappers never get parked at 97%.
          const hasVisibleContent = () => {
            const root = document.getElementById('root');
            if (!root) return false;
            if (!root.children.length) return false;
            if (root.querySelector('[data-aiwt-route-fallback="true"]')) return false;
            var rect = root.getBoundingClientRect();
            var text = (root.textContent || '').replace(/\s+/g, ' ').trim();
            var hasPageSignal = !!root.querySelector('header, main, nav, section, article, h1, h2, button, a, input');
            return (rect.height > 40 || root.scrollHeight > 40) && (text.length > 12 || hasPageSignal);
          };

          // RAF-based percentage counter (syncs with 8s CSS progressGrow timing)
          var STANDBY_LINES = [
            'OPTIMIZING RENDER PIPELINE',
            'STREAMING TOOL INDEX',
            'CALIBRATING SEARCH VECTORS',
            'ALIGNING PORTAL GATEWAY',
            'ALMOST THERE — HOLD TIGHT'
          ];
          var standbyIdx = 0, lastStandbyAt = 0;
          const updatePct = () => {
            if (removed || finishing) return;
            var elapsed = performance.now() - startTime;
            var duration = Math.max(MIN_BOOT_MS, routeReady ? 3300 : MAX_BOOT_MS);
            var t = Math.min(elapsed / duration, 1);
            var p;
            if (t < 0.15) p = 5 + (35 * (t / 0.15));
            else if (t < 0.35) p = 40 + (25 * ((t - 0.15) / 0.20));
            else if (t < 0.55) p = 65 + (15 * ((t - 0.35) / 0.20));
            else if (t < 0.75) p = 80 + (10 * ((t - 0.55) / 0.20));
            else p = 90 + ((routeReady ? 9 : 7) * ((t - 0.75) / 0.25));
            if (!routeReady) p = Math.min(p, 97);
            if (pct) pct.textContent = Math.round(p) + '%';
            // Keep the label alive with rotating standby copy whenever the bar
            // is parked waiting on the app — motion must never stop.
            if (!routeReady && p >= 96.5) {
              var now = performance.now();
              if (now - lastStandbyAt > 1400) {
                lastStandbyAt = now;
                var lbl = document.getElementById('aiwt-progress-label');
                if (lbl) lbl.textContent = STANDBY_LINES[standbyIdx % STANDBY_LINES.length];
                standbyIdx++;
              }
            }
            // JS-driven width as a fallback for mobile browsers that pause
            // long CSS animations in the background (iOS Safari throttles).
            if (bar) bar.style.width = Math.round(p) + '%';
            var sec = document.getElementById('progress-sec');
            if (sec) {
              var s = Math.max(0, Math.ceil((duration - elapsed) / 1000));
              sec.textContent = s + 's';
            }
            requestAnimationFrame(updatePct);
          };
          requestAnimationFrame(updatePct);

          window.addEventListener('aiwt:route-ready', function() {
            trace('aiwt:route-ready');
            routeReady = true;
            requestAnimationFrame(function() {
              requestAnimationFrame(function() { requestFinish('route-ready'); });
            });
          }, { once: true });
          if (routeReady) requestFinish('route-ready-flag');

          window.addEventListener('load', function() {
            if (hasVisibleContent()) {
              trace('window-load-content-ready');
              routeReady = true;
              requestFinish('window-load');
            }
          }, { once: true });

          // Poll for real content. Cheap on CPU (every 100ms) and stops as soon as found.
          var contentCheck = setInterval(function() {
            if (hasVisibleContent()) {
              clearInterval(contentCheck);
              routeReady = true;
              requestFinish('visible-content');
            }
          }, 100);

          // Watchdog: never let the Matrix cube trap visitors at 97%.
          // In dev/preview, HMR or a stale chunk can fail before React dispatches
          // route-ready; after one clean reload, reveal a recovery panel instead
          // of leaving a blocking loading screen over the site.
          setTimeout(function() {
            if (!removed) {
              var root = document.getElementById('root');
              var rootText = root ? (root.textContent || '').replace(/\s+/g, ' ').trim() : '';
              if (root && root.children.length && (rootText.length > 0 || root.querySelector('header, main, nav, section, article, h1, h2, button, a, input'))) {
                trace('watchdog-found-content');
                routeReady = true;
                requestFinish('watchdog-found-content');
                return;
              }
              trace('watchdog-recovery-panel');
              if (root && !root.children.length) {
                root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020817;color:#00ff66;font-family:monospace;text-align:center;padding:24px"><div><div style="width:56px;height:56px;margin:0 auto 18px;border:2px solid #00ff66;border-top-color:#67e8f9;border-radius:50%;animation:spin 1s linear infinite"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style><h1 style="font-size:24px;margin:0 0 12px;text-shadow:0 0 18px #00ff66">AI Web Tools is reconnecting</h1><p style="margin:0 0 18px;color:#67e8f9">The preview boot cache stalled. Use refresh once if this message stays visible.</p><button onclick="window.__aiwtReloadGuard&&window.__aiwtReloadGuard.clear();location.reload()" style="border:1px solid #00ff66;background:rgba(0,255,102,.14);color:#00ff66;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer">Refresh Portal</button></div></div>';
              }
              hardRemoveSpinner('watchdog-10s');
            }
          }, MAX_BOOT_MS);
        };

        const tryStart = () => {
          if (started) return;
          if (document.getElementById('progress-bar') && document.getElementById('progress-pct')) {
            start();
            return;
          }
          requestAnimationFrame(tryStart);
        };

        tryStart();
      })();
    </script>
